spec:
  runtime: python:3.9
  handler: main:handler
  init_context: function:init_context
  description: "Semantic segmentation with Segformer B5 trained on ADE20k to segment various landscape objects"
  build:
    commands:
      - pip install torch==2.7.1 torchvision==0.22.1
      - pip install segmentation-models-pytorch==0.5.0
      - pip install albumentations==2.0.8
      - pip install opencv-python-headless==4.12.0.88
      - pip install pillow==11.3.0
  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 268435456  # 256MB

